<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Shared Navigation Bar -->
    <header class="site-header" th:fragment="navbar">
        <div class="container">
            <nav class="nav-wrapper">
                <a th:href="@{/}" href="/" class="brand-logo">
                    <img th:src="@{/images/logo.jpg}" src="../static/images/logo.jpg" alt="La Panchina" class="brand-img">
                    <span>La Panchina</span>
                </a>

                <ul class="nav-links">
                    <li><a th:href="@{/}" href="/" class="nav-link">Home</a></li>
                    <li><a th:href="@{/menu}" href="/menu" class="nav-link">Menu</a></li>
                    <li><a th:href="@{/reservations}" href="/reservations" class="nav-link">Book a Table</a></li>
                    <li><a th:href="@{/reviews}" href="/reviews" class="nav-link active">Reviews &amp; Find Us</a></li>

                    <li th:if="${session.session_user == null}">
                        <a th:href="@{/login}" href="/login" class="nav-link">Login</a>
                    </li>

                    <li th:if="${session.session_user == null}">
                        <a th:href="@{/signup}" href="/signup" class="nav-link">Sign Up</a>
                    </li>
                    
                    <!-- Login as customer -->
                    <li th:if="${session.session_user != null and session.session_user.role == 'CUSTOMER'}">
                        <span class="nav-link" th:text="'Welcome, ' + ${session.session_user.name}"></span>
                    </li>

                    <!-- Login as admin -->
                    <li th:if="${session.session_user != null and session.session_user.role == 'ADMIN'}">
                        <a th:href="@{/admin}" href="/admin" class="nav-link">Admin Dashboard</a>
                    </li>

                    <!-- Logout -->
                    <li th:if="${session.session_user != null}">
                        <a th:href="@{/logout}" href="/logout" class="nav-link">Logout</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="section">
        <div class="container">

            <h1 class="section-title">Customer Reviews</h1>
            <p>See what our customers think about La Panchina.</p>

            <a class="btn btn-primary" th:href="@{/reviews/create}">
                Write a Review
            </a>

            <div class="grid grid-2">
                <div class="card" th:each="review : ${reviews}">
                    <h3 th:text="${review.appUser.name}"></h3> 
                    <p>
                        Rating:
                        <span th:text="${review.rating}"></span>/5
                    </p>
                    <p th:text="${review.comment}"></p>
                    <small>
                        Submitted:
                        <span th:text="${review.createdAt}"></span>
                    </small>
                    <small th:if="${review.updatedAt != null && review.updatedAt != review.createdAt}">
                        Updated:
                        <span th:text="${review.updatedAt}"></span>
                    </small>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
