<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div> <!--A container that has inside itself the form to add a new review-->
             <!--the form uses the action to know where to send the data from the form and the key($) to get the object-->
            <form th:action="@{/reviews/create}" th:object="${reviewS}" method="post">
                    <label for="rating">Rating [1-5]:</label>
                        <select id="rating" name="rating" >
                            <option>Select a rating</option>
                            <option value = 1>1 - Poor</option>
                            <option value = 2>2 - Fair</option>
                            <option value = 3>3 - Good</option>
                            <option value = 4>4 - Very Good</option>
                            <option value = 5>5 - Excellent</option>
                        </select>
                    <div th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}" class="text-error">
                    </div>

                    <div>
                        <input type="text" id="comment" name="comment">
                        placeholder="Comment is Optional">
                        <div th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" class="text-error">
                        </div>
                    </div>
                    <div>
                        <input class="btn btn-primary" type="submit" value="SEND"></input>
                    </div>
            </form>
            <div>
                <a th:href="@{/reviews}">Return</a>
            </div>
</body>
</html>
