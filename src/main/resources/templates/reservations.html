<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Table - La Panchina</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Reuse the navbar from index.html -->
    <header class="site-header" th:replace="~{index :: navbar}"></header>

    <main class="section">
        <div class="container" style="max-width: 600px;">
            <h2 class="text-center section-title">Reserve a Table</h2>

            <!-- Success Message (shows only if ?success=true is in the URL) -->
            <div th:if="${param.success}" class="card" style="background-color: #d4edda; border-color: #c3e6cb; color: #155724; margin-bottom: 1.5rem;">
                <p style="margin: 0; text-align: center;"><strong>Success!</strong> Your booking request has been submitted.</p>
            </div>
            
            <!-- NEW: Error Message Box (for backend validation failures) -->
            <div th:if="${errorMessage}" class="card" style="background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; margin-bottom: 1.5rem;">
                <p style="margin: 0; text-align: center;"><strong>Error:</strong> <span th:text="${errorMessage}"></span></p>
            <!-- Booking Form -->
            </div>

            <!-- Booking Form -->
            <div class="card">
                <!-- th:object binds the form to the "booking" object we created in the Controller -->
                <form th:action="@{/reservations}" th:object="${booking}" method="post">
                    
                    <div style="margin-bottom: 1rem;">
                        <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Name</label>
                        <input type="text" id="name" th:field="*{name}" required 
                               style="width: 100%; padding: 0.7rem; border: 1px solid var(--color-border); border-radius: var(--radius);">
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label for="date" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Date</label>
                        <input type="date" id="date" th:field="*{date}" required 
                               style="width: 100%; padding: 0.7rem; border: 1px solid var(--color-border); border-radius: var(--radius);">
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label for="time" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Time</label>
                        <input type="time" id="time" th:field="*{time}" required 
                               style="width: 100%; padding: 0.7rem; border: 1px solid var(--color-border); border-radius: var(--radius);">

                         <!-- Dynamic Hours Hint -->
                        <p id="hours-hint" style="margin-top: 0.5rem; font-size: 0.9rem; color: #666;">
                            Select a date above to see available hours.
                        </p>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label for="partySize" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Party Size</label>
                        <input type="number" id="partySize" th:field="*{partySize}" min="1" max="20" required 
                               style="width: 100%; padding: 0.7rem; border: 1px solid var(--color-border); border-radius: var(--radius);">

                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Reservation</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Reuse the footer from index.html -->
    <footer class="site-footer" th:replace="~{index :: footer}"></footer>
    	
    <!-- NEW: JavaScript for Date Restrictions and Dynamic Hours -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dateInput = document.getElementById('date');
            const hint = document.getElementById('hours-hint');
            // 1. Prevent picking past dates
            const today = new Date().toISOString().split('T')[0];
            dateInput.setAttribute('min', today);
            // 2. Show hours when a date is picked
            dateInput.addEventListener('change', function() {
                // getUTCDay is used to prevent timezone shifts changing the day
                const day = new Date(this.value + 'T00:00:00').getUTCDay();
                
                if (day === 1) { // Monday
                    hint.textContent = "Sorry, we are closed on Mondays.";
                    hint.style.color = "var(--color-terracotta)";
                } else if (day === 0) { // Sunday
                    hint.textContent = "Sunday Hours: 08:00 AM - 07:00 PM (Last booking 1 hr before closing)";
                    hint.style.color = "var(--color-olive)";
                } else { // Tue - Sat
                    hint.textContent = "Tue-Sat Hours: 08:00 AM - 09:00 PM (Last booking 1 hr before closing)";
                    hint.style.color = "var(--color-olive)";
                }
            });
        });
    </script>

</body>
</html>
