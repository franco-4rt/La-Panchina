<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - La Panchina</title>
</head>
<body>
    <header class = "site-header">
        <div class = "container">
            <a th:href="@{/}" class = "brand-logo">
                <!-- image of the logo-->
                 <span>La Panchina</span>
            </a>
            <ul class = "nav-links">
                <li><a th:href = "@{/}" class = "nav-link">Home</a></li>
                <li><a th:href = "@{/login}" class = "nav-link">Login</a></li>
                <li><a th:href = "@{/signup}" class = "nav-link active">Sign Up</a></li>
            </ul>
        </div>
    </header>

    <main class = "container" style = "max-width: 480px; margin: 40px auto; padding: 0 1rem;">
        <div class = "card" style = "text-align: left; padding: 2rem;">
            <h2 style = "text-align: center; margin-bottom: 1.5rem;">Create an Account</h2>

            <form th:action = "@{/signup}" th:object="${user}" method="post">
                <div style = "margin-bottom: 1rem;">
                    <label for="name" style = "display: block; font-weight: 600; margin-bottom: 0.35rem;">Prefered Name</label>
                    <input type = "text" id="name" th:field="*{name}" required style = "width: 100%; padding: 0.65rem; border: 1px solid var(--color-border); border-radius: var (--radius); font-size: 1rem;">
                    
                </div>
            </form>
        </div>
    </main>
</body>
</html>
