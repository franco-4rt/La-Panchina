<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - La Panchina</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <nav class="nav-wrapper">
                <a th:href="@{/}" class="brand-logo"><img th:src="@{/images/logo.jpg}" src="../static/images/logo.jpg" alt="La Panchina" class="brand-img">
                    <span>La Panchina</span>
                </a>
                <ul class="nav-links">
                    <li><a th:href="@{/}" class="nav-link">Home</a></li>
                    <li><a th:href="@{/login}" class="nav-link">Login</a></li>
                    <li><a th:href="@{/signup}" class="nav-link active">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Registration Card-->

    <main class="container" style="max-width: 480px; margin: 40px auto; padding: 0 1rem;">
        <div class="card" style="text-align: left; padding: 2rem;">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Create an Account</h2>

            <form th:action="@{/signup}" th:object="${user}" method="post">
                <!-- Name -->
                <div style="margin-bottom: 1rem;">
                    <label for="name" style="display: block; font-weight: 600; margin-bottom: 0.35rem;">Prefered
                        Name</label>
                    <input type="text" id="name" th:field="*{name}" required
                        style="width: 100%; padding: 0.65rem; border: 1px solid var(--color-border); border-radius: var (--radius); font-size: 1rem;">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: var(--color-terracotta-hover); font-size: 0.85rem; margin-top: 0.25rem;"></p>
                </div>

                <!-- Email -->
                <div style="margin-bottom: 1rem;">
                    <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.35rem;">Email</label>
                    <input type="email" id="email" th:field="*{email}" required
                           style="width: 100%; padding: 0.65rem; border: 1px solid var(--color-border); border-radius: var(--radius); font-size: 1rem;"
                           placeholder="you@example.com">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: var(--color-terracotta-hover); font-size: 0.85rem; margin-top: 0.25rem;"></p>
                </div>

                <!-- Password -->
                <div style="margin-bottom: 1rem;">
                    <label for="password" style="display: block; font-weight: 600; margin-bottom: 0.35rem;">Password</label>
                    <input type="password" id="password" th:field="*{password}" required
                           style="width: 100%; padding: 0.65rem; border: 1px solid var(--color-border); border-radius: var(--radius); font-size: 1rem;"
                           placeholder="--------">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: var(--color-terracotta-hover); font-size: 0.85rem; margin-top: 0.25rem;"></p>
                </div>

                <!-- Phone -->
                <div style="margin-bottom: 1rem;">
                    <label for="phone" style="display: block; font-weight: 600; margin-bottom: 0.35rem;">Phone (Optional)</label>
                    <input type="tel" id="phone" th:field="*{phone}"
                           style="width: 100%; padding: 0.65rem; border: 1px solid var(--color-border); border-radius: var(--radius); font-size: 1rem;"
                           placeholder="(555) 123-4567">
                </div>

                <!-- Contact Preference -->
                <div style="margin-bottom: 1.5rem;">
                    <label for="contactPreference" style="display: block; font-weight: 600; margin-bottom: 0.35rem;">Order &amp; Booking Updates</label>
                    <select id="contactPreference" th:field="*{contactPreference}"
                            style="width: 100%; padding: 0.65rem; border: 1px solid var(--color-border); border-radius: var(--radius); font-size: 1rem; background: #fff;">
                        <option value="EMAIL">Email</option>
                        <option value="SMS">SMS</option>
                    </select>
                </div>

                <!-- Button -->
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
                    Sign Up
                </button>
            </form>

            <p class="text-center" style="margin-top: 1.5rem; color: #666; font-size: 0.95rem;">
                Already have an account? <a th:href="@{/login}" style="font-weight: 600;">Log in here</a>
            </p>
        </div>
    </main>
</body>

</html>
