<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — La Panchina</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav class="nav-wrapper">
                <a th:href="@{/}" class="brand-logo">
                    <img th:src="@{/images/logo.jpg}" alt="La Panchina" class="brand-img">
                    <span>La Panchina</span>
                </a>
                <ul class="nav-links">
                    <li><a th:href="@{/}" class="nav-link">Home</a></li>
                    <li><a th:href="@{/login}" class="nav-link">Login</a></li>
                    <li><a th:href="@{/signup}" class="nav-link">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="max-width: 480px; margin: 40px auto; padding: 0 1rem;">
        <div class="card" style="text-align: left; padding: 2rem;">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Reset Password</h2>
            <p style="color: #666; text-align: center; font-size: 0.95rem; margin-bottom: 1.5rem;">
                Enter your account email and we'll send you a secure link to reset your password.
            </p>

            <!-- Feedback Messages -->
            <p th:if="${successMessage}" th:text="${successMessage}" class="success-message" style="margin-bottom: 1.25rem;"></p>
            <p th:if="${errorMessage}" th:text="${errorMessage}" class="warning-message"></p>

            <!-- Demo Link Helper for local grading and testing -->
            <div th:if="${demoResetLink}" style="background-color: var(--color-surface-warm); border: 1px dashed var(--color-border); padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem;">
                <strong style="color: var(--color-olive); display: block; margin-bottom: 0.35rem;">Password Reset Link:</strong>
                <a th:href="${demoResetLink}" th:text="${demoResetLink}" style="word-break: break-all; font-size: 0.9rem;"></a>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="input-container">
                    <label for="email" class="input-title">Registered Email</label>
                    <input class="input-box" type="email" id="email" name="email" required placeholder="you@example.com">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
                    Send Reset Link
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; color: #888; font-size: 0.95rem;">
                Remembered your password? <a th:href="@{/login}" style="font-weight: 600;">Back to Login</a>
            </p>
        </div>
    </main>
</body>
</html>
