<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — La Panchina</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav class="nav-wrapper">
                <a th:href="@{/}" class="brand-logo">
                    <img th:src="@{/images/logo.jpg}" alt="La Panchina" class="brand-img">
                    <span>La Panchina</span>
                </a>
                <ul class="nav-links">
                    <li><a th:href="@{/}" class="nav-link">Home</a></li>
                    <li><a th:href="@{/login}" class="nav-link active">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="max-width: 480px; margin: 40px auto; padding: 0 1rem;">
        <div class="card" style="text-align: left; padding: 2rem;">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Create New Password</h2>
            <p style="color: #666; text-align: center; font-size: 0.95rem; margin-bottom: 1.5rem;">
                Please choose a strong password with at least 12 characters, upper and lower case, and numbers.
            </p>

            <p th:if="${errorMessage}" th:text="${errorMessage}" class="warning-message"></p>

            <form th:action="@{/reset-password}" method="post">
                <!-- Hidden Token -->
                <input type="hidden" name="token" th:value="${token}">

                <div class="input-container">
                    <label for="newPassword" class="input-title">New Password</label>
                    <input class="input-box" type="password" id="newPassword" name="newPassword" minlength="12" required placeholder="••••••••">
                </div>

                <div class="input-container">
                    <label for="confirmPassword" class="input-title">Confirm New Password</label>
                    <input class="input-box" type="password" id="confirmPassword" name="confirmPassword" minlength="6" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
                    Update Password
                </button>
            </form>
        </div>
    </main>
</body>
</html>
