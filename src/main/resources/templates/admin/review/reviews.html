<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <table class="admin-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>USER</th>
                <th>RATING</th>
                <th>COMMENT</th>
                <th>DATE SUBMMITED</th>
                <th>DATE UPDATED</th>
                <th>ACTIONS</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="review :${reviews}">
                <td th:text="${review.rid}"></td>
                <td th:text="${review.appUser.name}"></td>
                <td th:text="${review.rating} + '/5'"></td>
                <td th:text="${review.comment}"></td>
                <td th:text="${review.createdAt}"></td>
                <td th:text="${review.updatedAt}"></td>
                <td>
                    <a class="btn btn-primary" 
                    th:href="@{/admin/reviews/delete/{rid}(rid=${review.rid})}">DELETE</a>
                </td>
            </tr>
        </tbody>
    </table>


</body>
</html>
