<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Management</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}" href="../static/images/logo.jpg">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <body>
    <!-- Navigation Bar -->
    <header class="site-header">
        <div class="container">
            <nav class="nav-wrapper">
                <a th:href="@{/}" class="brand-logo">
                    <img th:src="@{/images/logo.jpg}" alt="La Panchina" class="brand-img">
                    <span>La Panchina (Admin)</span>
                </a>
                <ul class="nav-links">
                    <li><a th:href="@{/}" class="nav-link">Home</a></li>
                    <li><a th:href="@{/admin}" class="nav-link active">Admin Dashboard</a></li>
                    <li><a th:href="@{/logout}" class="nav-link">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!--form taken from customers review-->
    <form th:action="@{/admin/reviews}" method="get">
        <label for="sort">Sort reviews:</label>
        <select id="sort" name="sort" onchange="this.form.submit()">
            <option value="none" th:selected="${currentSort == 'none'}">
                None
            </option>

            <option value="timeAsc" th:selected="${currentSort == 'timeAsc'}">
                Time ↑
            </option>

            <option value="timeDesc" th:selected="${currentSort == 'timeDesc'}">
                Time ↓
            </option>

            <option value="ratingAsc" th:selected="${currentSort == 'ratingAsc'}">
                Rating ↑
            </option>

            <option value="ratingDesc" th:selected="${currentSort == 'ratingDesc'}">
                Rating ↓
            </option>

        </select>
    </form>

    <table class="admin-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>USER</th>
                <th>RATING</th>
                <th>COMMENT</th>
                <th>DATE SUBMMITED</th>
                <th>DATE UPDATED</th>
                <th>ACTIONS</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="review :${reviews}">
                <td th:text="${review.rid}"></td>
                <td th:text="${review.appUser.name}"></td>
                <td th:text="${review.rating} + '/5'"></td>
                <td th:text="${review.comment}"></td>
                <td th:text="${review.createdAt}"></td>
                <td th:text="${review.updatedAt}"></td>
                <td>
                    <a class="btn btn-primary" 
                    th:href="@{/admin/delete/{rid}(rid=${review.rid})}">DELETE</a>
                </td>
            </tr>
        </tbody>
    </table>
    <footer class="site-footer" th:replace="~{index :: footer}"></footer>

</body>
</html>
