spring.application.name=la-panchina
spring.config.import=optional:file:.env[.properties]

# Use Render's environment variables if they exist, otherwise fallback to local H2 database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:lapanchina}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (harmless in production, essential for local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true